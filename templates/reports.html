{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="display-5">
            <i class="fas fa-chart-bar text-warning me-3"></i>
            Reports
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow mb-4">
            <div class="card-header bg-warning text-dark">
                <h5 class="mb-0">Generate Report</h5>
            </div>
            <div class="card-body">
                <form id="reportForm">
                    <div class="mb-3">
                        <label>Report Type</label>
                        <select class="form-control" id="reportType">
                            <option value="inventory">Inventory Report</option>
                            <option value="sales">Sales Report</option>
                            <option value="expiry">Expiry Report</option>
                            <option value="suppliers">Supplier Report</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label>Format</label>
                        <select class="form-control" id="reportFormat">
                            <option value="pdf">PDF</option>
                            <option value="csv">CSV</option>
                            <option value="excel">Excel</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label>Start Date</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    
                    <div class="mb-3">
                        <label>End Date</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    
                    <button type="submit" class="btn btn-warning w-100">Generate Report</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Report Preview</h5>
            </div>
            <div class="card-body">
                <div id="reportPreview" class="text-center p-5">
                    <i class="fas fa-file-alt fa-4x text-muted mb-3"></i>
                    <p class="text-muted">Select report options and click Generate</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
