{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" 
         alt="Peninsula Hospital Centre" 
         height="80" 
         class="mb-3"
         style="border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
    <h3 class="mb-0">PENINSULA HOSPITAL CENTRE</h3>
    <p class="mb-0">Pharmacy Management System</p>
    <small class="d-block mt-2">
        <i class="fas fa-map-marker-alt me-1"></i> No. 1 Macarthy Drive, Off Peninsula Road Tokeh, Freetown<br>
        <i class="fas fa-phone me-1"></i> +23273475252
    </small>
</div>
            
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user me-2"></i>Username
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="fas fa-lock me-2"></i>Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Login
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="card-footer text-center py-3">
                <small class="text-muted">Default login: admin / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
